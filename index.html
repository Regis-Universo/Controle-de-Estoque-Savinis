<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio-Lógica-de-Promoção-SENAI-RN</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

     <main class="container">
    <h1>📦 Controle de Estoque</h1>
    <p class="subtitulo">Savinis — sistema de entrada e saída de peças</p>

    <!-- PAINEL DE SALDO -->
    <section class="painel-saldo">
      <span class="rotulo">Saldo atual</span>
      <span class="valor" id="saldo-valor">—</span>
    </section>

      <!-- FORMULÁRIO -->
    <form id="form-operacao" novalidate>
      <div class="form-grupo">
        <label for="input-saldo-inicial">Saldo inicial da peça</label>
        <input
          type="number"
          id="input-saldo-inicial"
          min="0"
          step="1"
          placeholder="Ex.: 100"
          required
        />
      </div>
    



</body>
</html>
